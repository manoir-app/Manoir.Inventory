name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  dotnet-build-test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content "eng/Versions.props"
          $baseVersion = $props.Project.PropertyGroup.MaNoirVersionPrefix

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          else {
            $parts = $baseVersion.Split('.')

            if ($parts.Length -lt 2) {
              throw "MaNoirVersionPrefix must contain at least major.minor. Current value: $baseVersion"
            }

            $version = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore Manoir.Inventory.slnx

      - name: Build
        run: dotnet build Manoir.Inventory.slnx --configuration Release --no-restore /p:Version=${{ steps.version.outputs.version }}

      - name: Run unit tests
        run: dotnet test tests/MaNoir.Inventory.UnitTests/MaNoir.Inventory.UnitTests.csproj --configuration Release --no-build

      - name: Run functional tests
        run: dotnet test tests/MaNoir.Inventory.FunctionalTests/MaNoir.Inventory.FunctionalTests.csproj --configuration Release --no-build

      - name: Pack NuGet packages
        run: dotnet pack packages/MaNoir.Inventory.Contracts/MaNoir.Inventory.Contracts.csproj --configuration Release --no-build -o artifacts/nuget /p:Version=${{ steps.version.outputs.version }}

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

  dotnet-publish:
    runs-on: ubuntu-latest
    needs:
      - dotnet-build-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Publish NuGet packages to GitHub Packages
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
