name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  dotnet-build-test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content "eng/Versions.props"
          $baseVersion = $props.Project.PropertyGroup.MaNoirVersionPrefix

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          else {
            $parts = $baseVersion.Split('.')

            if ($parts.Length -lt 2) {
              throw "MaNoirVersionPrefix must contain at least major.minor. Current value: $baseVersion"
            }

            $version = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore Manoir.Inventory.slnx

      - name: Build
        run: dotnet build Manoir.Inventory.slnx --configuration Release --no-restore /p:Version=${{ steps.version.outputs.version }}

      - name: Run unit tests
        run: dotnet test tests/MaNoir.Inventory.UnitTests/MaNoir.Inventory.UnitTests.csproj --configuration Release --no-build

      - name: Run functional tests
        run: dotnet test tests/MaNoir.Inventory.FunctionalTests/MaNoir.Inventory.FunctionalTests.csproj --configuration Release --no-build

      - name: Pack NuGet packages
        run: dotnet pack packages/MaNoir.Inventory.Contracts/MaNoir.Inventory.Contracts.csproj --configuration Release --no-build -o artifacts/nuget /p:Version=${{ steps.version.outputs.version }}

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

  dotnet-publish:
    runs-on: ubuntu-latest
    needs:
      - dotnet-build-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Publish NuGet packages to GitHub Packages
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

  ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/MaNoir.Inventory.AdminUi.Front/package-lock.json

      - name: Configure npm registries
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set @manoir-app:registry https://npm.pkg.github.com
          npm config set replace-registry-host never
          npm config set //npm.pkg.github.com/:_authToken "${NODE_AUTH_TOKEN}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: ui/MaNoir.Inventory.AdminUi.Front
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        working-directory: ui/MaNoir.Inventory.AdminUi.Front
        run: npm run typecheck

      - name: Build
        working-directory: ui/MaNoir.Inventory.AdminUi.Front
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: adminui
            image: manoir-inventory-adminui
            dockerfile: apps/MaNoir.Inventory.AdminUi/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

  publish-plugin-catalog:
    runs-on: ubuntu-latest
    needs:
      - docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # This job keeps manoir.plugin.yaml and Manoir.PluginCatalog in sync. Without it,
      # the catalog entry silently drifts from this repo's manifest (it was previously
      # maintained by hand).
      - name: Publish plugin catalog entry
        id: publish
        uses: manoir-app/manoir-plugin-action@main
        with:
          catalog-repository-url: https://github.com/manoir-app/Manoir.PluginCatalog.git
          catalog-token: ${{ secrets.PLUGIN_CATALOG_TOKEN }}
          manifest-path: manoir.plugin.yaml
          workspace-path: ${{ github.workspace }}
